<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>ファイルから読む · Code Reading Studio</title>
  <link rel="stylesheet" href="/studio.css?v=f3a8b6fa8a20">
  <link rel="stylesheet" href="/files.css">

  <script type="module" src="/files.js"></script>
<script defer src="/learning-content.js"></script><script defer src="/learning.js"></script><script defer src="/studio.js"></script></head>
<body data-studio="local" class="files-page"><header class="studio-header"><a class="studio-brand" href="/"><span class="studio-mark" aria-hidden="true">⌘</span>Code Reading Studio</a><span class="studio-project">Reth · v2.7.0</span><label class="studio-learner">読み方<select aria-label="読み方" data-learning-profile><option value="foundation">基礎から学ぶ</option><option value="familiar">ブロックチェーンの基礎はわかる</option><option value="code">コードを中心に読む</option></select></label></header><nav class="studio-nav" aria-label="主な入口"><a data-view="learn" href="/">学ぶ</a><a data-view="explore" href="/reader">コードを調べる</a><a data-learning-return href="/">学習の入口へ戻る</a><details class="studio-tools"><summary>資料・道具</summary><div class="studio-tools-menu"><a href="/files">ファイル名から探す</a><a href="/guide">説明・印刷用の資料</a><p>参照版：Reth v2.7.0</p></div></details></nav>


  <header class="context-toolbar">
    <span id="files-commit">固定コミットを確認中…</span>
    <a id="files-guide" href="/startup">起動ガイドへ</a>
    <a id="files-github" href="https://github.com/paradigmxyz/reth" target="_blank" rel="noreferrer" hidden>GitHubで開く ↗</a>
  </header>
  <div class="files-layout">
    <aside class="files-sidebar" aria-label="リポジトリのファイル">
      <div class="files-sidebar-heading"><strong>ファイル</strong><button id="files-collapse" type="button">折りたたむ</button></div>
      <label class="files-search-label" for="files-search">名前・パスで探す</label>
      <input id="files-search" type="search" placeholder="例: bin/reth、launch.rs" autocomplete="off" spellcheck="false">
      <p id="files-search-count" class="files-meta" aria-live="polite"></p>
      <nav id="files-tree" aria-label="ファイルツリー"></nav>
    </aside>
    <main class="files-main" id="files-main">
      <nav id="files-crumb" class="files-crumb" aria-label="現在のパス"></nav>
      <p id="files-status" role="status" aria-live="polite">ファイル一覧を読み込んでいます…</p>
      <div id="files-content"></div>
    </main>
  </div>
</body>
</html>
