<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="studio-token" content="__TOKEN__">
  <title>ファイルから読む · Code Reading Studio</title>
  <link rel="stylesheet" href="/studio.css">
  <link rel="stylesheet" href="/files.css">
  <script defer src="/studio.js"></script>
  <script type="module" src="/files.js"></script>
</head>
<body data-studio="local" class="files-page"><header class="studio-header"><a class="studio-brand" href="/startup"><span class="studio-mark">⌘</span>Code Reading Studio</a><span class="studio-project">paradigmxyz / reth · v2.7.0</span><span class="studio-mode">LOCAL WORKSPACE</span></header><nav class="studio-nav" aria-label="読み方"><a data-view="startup" href="/startup">起動ガイド</a><a data-view="structure" href="/#lens=structure">構造から読む</a><a data-view="flow" href="/#lens=flow">送信経路を読む</a><a data-view="rust" href="/#lens=rust">Rust・設計</a><a data-view="files" href="/files">ファイルから読む</a><a data-view="guide" href="/guide">説明資料</a></nav>


  <header class="context-toolbar">
    <span id="files-commit">固定コミットを確認中…</span>
    <a id="files-guide" href="/startup">起動ガイドへ</a>
    <a id="files-github" href="https://github.com/paradigmxyz/reth" target="_blank" rel="noreferrer" hidden>GitHubで開く ↗</a>
  </header>
  <div class="files-layout">
    <aside class="files-sidebar" aria-label="リポジトリのファイル">
      <div class="files-sidebar-heading"><strong>ファイル</strong><button id="files-collapse" type="button">折りたたむ</button></div>
      <label class="files-search-label" for="files-search">名前・パスで探す</label>
      <input id="files-search" type="search" placeholder="例: bin/reth、launch.rs" autocomplete="off" spellcheck="false">
      <p id="files-search-count" class="files-meta" aria-live="polite"></p>
      <nav id="files-tree" aria-label="ファイルツリー"></nav>
    </aside>
    <main class="files-main" id="files-main">
      <nav id="files-crumb" class="files-crumb" aria-label="現在のパス"></nav>
      <p id="files-status" role="status" aria-live="polite">ファイル一覧を読み込んでいます…</p>
      <div id="files-content"></div>
    </main>
  </div>
</body>
</html>
